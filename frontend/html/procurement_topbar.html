<header class="cai-topbar">
  <div class="cai-topbar__brand">
    <img class="cai-topbar__logo" src="../assets/1.svg" alt="Carl's Angels logo">
    <span class="cai-topbar__name">Carl's Angels Inventory Management</span>
  </div>

  <div class="cai-topbar__actions">
    <button class="cai-topbar__bell" type="button" aria-label="Notifications">
      <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
    </button>

    <button class="cai-topbar__user" type="button">
      <span class="cai-topbar__avatar">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </span>
      <span class="cai-topbar__user-text">
        <span class="cai-topbar__user-name">Nestlee Gier</span><br>
        <span class="cai-topbar__user-role">Procurement Staff</span>
      </span>
      <svg class="cai-topbar__chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </button>
  </div>
</header>
