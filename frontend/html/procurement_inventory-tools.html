<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools — Carl's Angels Inventory Management</title>
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/projects.css">
<link rel="stylesheet" href="../css/boq.css">
<link rel="stylesheet" href="../css/tools.css">
</head>
<body>

<div class="cai-app">
  <div id="cai-topbar-slot"></div>

  <div class="cai-body">
    <div id="cai-sidebar-slot"></div>

    <main class="cai-content">

      <div class="proj-topline">
        <nav class="proj-breadcrumb" aria-label="Breadcrumb">
          <span>Operations</span>
          <span aria-hidden="true"> &gt; </span>
          <a href="procurement_inventory.html">Inventory</a>
          <span aria-hidden="true"> &gt; </span>
          <span class="proj-breadcrumb__current" aria-current="page">Tools</span>
        </nav>
      </div>

      <div class="tools-toolbar">
        <label class="tools-filter">
          <span class="tools-filter__label">Project</span>
          <select class="boq-input boq-select tools-filter__control" id="tools-project-filter" aria-label="Filter by project"></select>
        </label>

        <div class="tools-stats">
          <div class="tools-stat">
            <p class="tools-stat__label">In Use</p>
            <p class="tools-stat__value" id="tools-stat-inuse">0</p>
          </div>
          <div class="tools-stat">
            <p class="tools-stat__label">Under Repair</p>
            <p class="tools-stat__value" id="tools-stat-repair">0</p>
          </div>
        </div>
      </div>

      <div class="proj-tabs" role="group" aria-label="Inventory sections">
        <a class="proj-tabs__tab" href="procurement_inventory.html">Inventory</a>
        <a class="proj-tabs__tab proj-tabs__tab--active" href="procurement_inventory-tools.html" aria-current="page">Tools</a>
      </div>

      <section class="proj-card" aria-label="Tools and equipment">
        <div class="proj-table-scroll">
          <table class="proj-table tools-table">
            <thead>
              <tr>
                <th>Tool / Equipment</th>
                <th>Assigned Project</th>
                <th>Location</th>
                <th>Quantity</th>
                <th>Status</th>
                <th>Assigned To</th>
              </tr>
            </thead>
            <tbody id="tools-rows"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<script>
// Hardcoded sample data (prototype only). Nothing is persisted.
// Tools/equipment are reusable assets, tracked separately from the
// consumable materials on the Inventory tab.
window.CAI_TOOLS = {
  projects: ['Office Renovation - Makati', 'Site B - Manila', 'Site C - Pasay'],
  defaultProject: 'Office Renovation - Makati',   // selected when the page opens, same as procurement_inventory.html
  statuses: ['Available', 'In Use', 'Under Repair'],

  items: [
    { tool: 'Concrete Mixer', project: 'Office Renovation - Makati', location: 'Site A Storage', quantity: 2, status: 'In Use', assignedTo: 'Foreman Team A' },
    { tool: 'Scaffolding Set', project: 'Office Renovation - Makati', location: 'Site A Storage', quantity: 5, status: 'Available', assignedTo: '' },
    { tool: 'Power Drill', project: 'Site B - Manila', location: 'Site B Storage', quantity: 4, status: 'In Use', assignedTo: 'Electrical Team' },
    { tool: 'Jackhammer', project: 'Site B - Manila', location: 'Site B Storage', quantity: 1, status: 'Under Repair', assignedTo: '' },
    { tool: 'Generator 5kVA', project: 'Site C - Pasay', location: 'Site C Storage', quantity: 2, status: 'Available', assignedTo: '' },
    { tool: 'Welding Machine', project: 'Site C - Pasay', location: 'Site C Storage', quantity: 1, status: 'In Use', assignedTo: 'Steel Works Team' }
  ]
};
</script>
<script src="../js/layout.js"></script>
<script src="../js/tools.js"></script>
</body>
</html>
