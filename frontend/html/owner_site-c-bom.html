<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site C BOM — Carl's Angels Inventory Management</title>
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/projects.css">
<link rel="stylesheet" href="../css/boq.css">
<link rel="stylesheet" href="../css/bom.css">
</head>
<body>

<div class="cai-app">
  <div id="cai-topbar-slot"></div>

  <div class="cai-body">
    <div id="cai-sidebar-slot"></div>

    <main class="cai-content">

      <div class="proj-topline">
        <nav class="proj-breadcrumb" aria-label="Breadcrumb">
          <a href="owner_projects.html">Projects</a>
          <span aria-hidden="true"> &gt; </span>
          <a href="owner_site-c.html">Site C</a>
          <span aria-hidden="true"> &gt; </span>
          <span class="proj-breadcrumb__current" aria-current="page">BOM</span>
        </nav>
      </div>

      <div class="proj-tabs" role="group" aria-label="Site sections">
        <a class="proj-tabs__tab" href="owner_site-c.html">BOQ</a>
        <a class="proj-tabs__tab proj-tabs__tab--active" href="owner_site-c-bom.html" aria-current="page">BOM</a>
        <button class="proj-tabs__tab" type="button" disabled title="Not built yet">Project Goals</button>
        <button class="proj-tabs__tab" type="button" disabled title="Not built yet">Usage vs Progress</button>
        <button class="proj-tabs__tab" type="button" disabled title="Not built yet">Cost Variance</button>
        <button class="proj-tabs__tab" type="button" disabled title="Not built yet">Billing Support</button>
        <button class="proj-tabs__tab" type="button" disabled title="Not built yet">Change Orders</button>
        <button class="proj-tabs__tab" type="button" disabled title="Not built yet">Project Closeout</button>
      </div>

      <div class="proj-header">
        <h1 class="proj-title">Bill of Materials</h1>
      </div>

      <div class="bom-stats">
        <div class="bom-stat">
          <p class="bom-stat__label">Items</p>
          <p class="bom-stat__value" id="stat-items">0</p>
        </div>
        <div class="bom-stat">
          <p class="bom-stat__label">Fully Used</p>
          <p class="bom-stat__value" id="stat-full">0</p>
        </div>
        <div class="bom-stat">
          <p class="bom-stat__label">Over Planned Quantity</p>
          <p class="bom-stat__value" id="stat-over">0</p>
        </div>
      </div>

      <section class="proj-card" aria-label="Materials">
        <div class="bom-table-scroll">
          <table class="bom-table" id="bom-table"></table>
        </div>
      </section>

    </main>
  </div>
</div>

<script>
// Hardcoded sample data for Site C. Qty is the planned quantity; used is
// what has been consumed so far.
window.CAI_BOM = {
  slug: 'site-c',
  name: 'Site C',
  sections: [
    {
      title: 'Carpentry and formworks',
      items: [
        { desc: 'Plywood 3/4 in', qty: 320, unit: 'sheet', used: 215 },
        { desc: 'Coco lumber 2 x 3 x 10 ft', qty: 600, unit: 'pc', used: 380 },
        { desc: 'Common wire nails', qty: 150, unit: 'kg', used: 96 }
      ]
    },
    {
      title: 'Plumbing works',
      items: [
        { desc: 'PVC pipe 4 in', qty: 120, unit: 'pc', used: 120 },
        { desc: 'PPR water supply pipe', qty: 200, unit: 'm', used: 45 }
      ]
    },
    {
      title: 'Painting works',
      items: [
        { desc: 'Primer', qty: 60, unit: 'gal', used: 12 },
        { desc: 'Latex paint', qty: 140, unit: 'gal', used: 0 }
      ]
    }
  ]
};
</script>
<script src="../js/layout.js"></script>
<script src="../js/bom.js"></script>
</body>
</html>
