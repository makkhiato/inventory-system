<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>

<div class="cai-app">
  <div id="cai-topbar-slot"></div>

  <div class="cai-body">
    <div id="cai-sidebar-slot"></div>

    <main class="cai-content">

      <div class="proj-topline">
        <nav class="proj-breadcrumb" aria-label="Breadcrumb">
          <a href="owner_projects.html">Project List</a>
          <span aria-hidden="true"> &gt; </span>
          <a href="owner_site-a.html">Site A</a>
          <span aria-hidden="true"> &gt; </span>
          <span class="proj-breadcrumb__current" aria-current="page">Change Orders</span>
        </nav>
      </div>

      <div class="proj-tabs" role="group" aria-label="Site sections">
        <a class="proj-tabs__tab" href="owner_site-a.html">BOQ</a>
        <a class="proj-tabs__tab" href="owner_site-a-bom.html">BOM</a>
        <a class="proj-tabs__tab" href="owner_site-a-goals.html">Project Goals</a>
        <a class="proj-tabs__tab" href="owner_site-a-usage.html">Usage vs Progress</a>
        <a class="proj-tabs__tab" href="owner_site-a-variance.html">Cost Variance</a>
        <a class="proj-tabs__tab" href="owner_site-a-billing.html">Billing Support</a>
        <a class="proj-tabs__tab proj-tabs__tab--active" href="owner_site-a-changes.html" aria-current="page">Change Orders</a>
        <button class="proj-tabs__tab" type="button" disabled title="Not built yet">Project Closeout</button>
      </div>

      <div class="co-header">
        <h1 class="proj-title">Change Orders</h1>
        <label class="co-project">Project
          <select class="proj-select__control"><option>Office Renovation - Makati</option></select>
        </label>
        <button class="cai-btn cai-btn--primary" type="button" id="co-new">+ New Change Order</button>
      </div>

      <div class="co-stats">
        <div class="co-stat"><p class="co-stat__label">Awaiting decision</p><p class="co-stat__value" id="co-pending"></p></div>
        <div class="co-stat"><p class="co-stat__label">Approved cost impact</p><p class="co-stat__value" id="co-approved"></p></div>
        <div class="co-stat"><p class="co-stat__label">Rejected</p><p class="co-stat__value" id="co-rejected"></p></div>
        <div class="co-stat"><p class="co-stat__label">Contract now</p><p class="co-stat__value" id="co-contract"></p></div>
      </div>

      <div id="co-list"></div>

    </main>
  </div>
</div>
